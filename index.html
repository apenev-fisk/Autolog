        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }

<body class="pb-12">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="watermarked_img_16635183195398438804.jpg" alt="Logo" class="w-8 h-8 rounded-lg object-cover border border-orange-500/30 shadow">
                <span class="font-bold text-lg tracking-tight text-white">Auto<span class="text-orange-500">Log</span></span>
            </div>
            <div class="text-xs font-semibold text-slate-400">
                Моите автомобили
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Car Selection Bar -->
        <div class="flex items-center justify-between gap-2 glass p-2 rounded-xl">
            <div class="flex items-center gap-2 flex-1">
                <i class="fa-solid fa-garage text-slate-400 text-xs ms-1"></i>
                <select id="carSelect" onchange="switchCar(this.value)" class="glass-input text-xs font-semibold rounded-lg px-2 py-1.5 w-full">
                    <!-- Dynamic Cars -->
                </select>
            </div>
            <button onclick="openCarModal()" class="px-3 py-1.5 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1 transition shadow">
                <i class="fa-solid fa-plus"></i> Кола
            </button>
        </div>

        <!-- Vehicle Profile Card -->
        <section class="glass rounded-2xl p-4 shadow-xl relative overflow-hidden space-y-2">
            <div class="flex items-start justify-between">
                <div>
                    <span id="carFuelBadge" class="inline-block px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase bg-slate-800 text-orange-400 rounded-md mb-1 border border-slate-700">
                        --
                    </span>
                    <h2 id="carTitle" class="text-xl font-bold text-white tracking-tight">Зареждане...</h2>
                    <p id="carSubTitle" class="text-xs text-slate-400 mt-0.5">--</p>
                </div>
                <div class="flex gap-1">
                    <button onclick="openCarModal(true)" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                    </button>
                    <button onclick="deleteCurrentCar()" class="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- VIN / Frame Display -->
            <div id="carVinDisplay" class="text-[11px] text-slate-400 font-mono bg-slate-900/40 px-2.5 py-1 rounded-lg border border-slate-800/60 hidden">
                <i class="fa-solid fa-fingerprint me-1 text-orange-400"></i> VIN: <span id="carVinText" class="text-slate-300">--</span>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80">
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/50">
                    <span id="fuelLabel" class="text-[11px] text-slate-400 block font-medium">Цена гориво (днес)</span>
                    <span id="carFuelPrice" class="text-base font-bold text-orange-400">€ 0.00 / л</span>
                </div>
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/50">
                    <span class="text-[11px] text-slate-400 block font-medium">Общо разходи</span>
                    <span id="totalSpent" class="text-base font-bold text-emerald-400">€ 0.00</span>
                </div>
            </div>
        </section>

        <!-- Quick Add Record Action -->
        <button onclick="openRecordModal()" class="w-full py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-semibold rounded-xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 transition active:scale-[0.99]">
            <i class="fa-solid fa-plus-circle"></i> Добави обслужване / ремонт
        </button>

        <!-- Filter & Service History -->
        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">История</h3>
                <select id="filterCategory" onchange="renderRecords()" class="glass-input text-xs rounded-lg px-2 py-1">
                    <option value="all">Всички категории</option>
                    <option value="Масло & Филтри">Масло & Филтри</option>
                    <option value="Спирачна система">Спирачна система</option>
                    <option value="Ходова част & Окачване">Ходова част & Окачване</option>
                    <option value="Двигател & Трансмисия">Двигател & Трансмисия</option>
                    <option value="Запалителна / Горивна система">Запалителна / Горивна система</option>
                    <option value="Климатик & Охлаждане">Климатик & Охлаждане</option>
                    <option value="Акумулатор & Електроника">Акумулатор & Електроника</option>
                    <option value="Гуми & Джанти">Гуми & Джанти</option>
                    <option value="Документи & Винетки">Документи & Винетки</option>
                    <option value="Други">Други</option>
                </select>
            </div>

            <div id="recordsList" class="space-y-2.5">
                <!-- Records injected here -->
            </div>
        </section>
    </main>

    <!-- Modal: Add/Edit Car -->
    <div id="carModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <h3 id="carModalTitle" class="text-lg font-bold text-white">Добавяне на автомобил</h3>
            <form id="carForm" onsubmit="saveCar(event)" class="space-y-3">
                <input type="hidden" id="carId">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Марка автомобил</label>
                    <select id="carBrandSelect" onchange="onBrandChange()" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                        <option value="BMW">BMW</option>
                        <option value="Volkswagen">Volkswagen (VW)</option>
                        <option value="Audi">Audi</option>
                        <option value="Mercedes-Benz">Mercedes-Benz</option>
                        <option value="Citroen">Citroen</option>
                        <option value="Peugeot">Peugeot</option>
                        <option value="Toyota">Toyota</option>
                        <option value="Lexus">Lexus</option>
                        <option value="Hyundai">Hyundai</option>
                        <option value="Kia">Kia</option>
                        <option value="Mazda">Mazda</option>
                        <option value="Honda">Honda</option>
                        <option value="Renault">Renault</option>
                        <option value="Dacia">Dacia</option>
                        <option value="Skoda">Skoda</option>
                        <option value="Ford">Ford</option>
                        <option value="Opel">Opel</option>
                        <option value="Fiat">Fiat</option>
                        <option value="Alfa Romeo">Alfa Romeo</option>
                        <option value="Seat">Seat</option>
                        <option value="Друга">Друга марка (Ръчно)</option>
                    </select>
                </div>
                
                <div id="customBrandContainer" class="hidden">
                    <label class="text-xs text-slate-400 block mb-1">Въведете марка и модел</label>
                    <input type="text" id="carCustomName" placeholder="напр. Subaru Outback" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Модел (1995 - 2020)</label>
                    <select id="carModelSelect" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                        <!-- Populated dynamically via JS -->
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Двигател / Модификация</label>
                    <select id="carEngineSelect" onchange="onEngineChange()" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                        <!-- Populated dynamically via JS -->
                    </select>
                </div>

                <div id="customEngineContainer" class="hidden">
                    <label class="text-xs text-slate-400 block mb-1">Въведете двигател (Ръчно)</label>
                    <input type="text" id="carCustomEngine" placeholder="напр. 2.5 V6 (170 hp)" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Гориво (Автоматично/Ръчно)</label>
                        <select id="carFuelInput" class="w-full glass-input rounded-xl px-3 py-2 text-sm bg-slate-900/80 text-orange-400 font-bold">
                            <option value="Бензин">Бензин (A95)</option>
                            <option value="Дизел">Дизел</option>
                            <option value="Газ">Газ (LPG)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Година на производство</label>
                        <input type="number" id="carYearInput" placeholder="2011" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">VIN номер (Рама)</label>
                        <input type="text" id="carVinInput" placeholder="VF7... / WBA..." class="w-full glass-input rounded-xl px-3 py-2 text-sm uppercase">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Текущ пробег (км)</label>
                        <input type="number" id="carKmInput" placeholder="185000" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeCarModal()" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-sm font-semibold hover:bg-slate-700">Отказ</button>
                    <button type="submit" class="flex-1 py-2 bg-orange-600 text-white rounded-xl text-sm font-semibold hover:bg-orange-500">Запази</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add Record -->
    <div id="recordModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">Нов запис за обслужване</h3>
            <form id="recordForm" onsubmit="saveRecord(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Заглавие / Описание</label>
                    <input type="text" id="recTitle" required placeholder="Смяна на масло и филтри" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Категория</label>
                        <select id="recCategory" onchange="toggleFilterOptions()" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                            <option value="Масло & Филтри">Масло & Филтри</option>
                            <option value="Спирачна система">Спирачна система</option>
                            <option value="Ходова част & Окачване">Ходова част & Окачване</option>
                            <option value="Двигател & Трансмисия">Двигател & Трансмисия</option>
                            <option value="Запалителна / Горивна система">Запалителна / Горивна система</option>
                            <option value="Климатик & Охлаждане">Климатик & Охлаждане</option>
                            <option value="Акумулатор & Електроника">Акумулатор & Електроника</option>
                            <option value="Гуми & Джанти">Гуми & Джанти</option>
                            <option value="Документи & Винетки">Документи & Винетки</option>
                            <option value="Други">Други</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Дата</label>
                        <input type="date" id="recDate" required class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>

                <!-- Oil Filter Checkboxes -->
                <div id="filterCheckboxes" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-2">
                    <label class="text-xs font-semibold text-orange-400 block">Сменени филтри:</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" id="chkOilFilter" checked class="accent-orange-500 rounded">
                            <span>Маслен филтър</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" id="chkAirFilter" checked class="accent-orange-500 rounded">
                            <span>Въздушен филтър</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" id="chkCabinFilter" checked class="accent-orange-500 rounded">
                            <span>Филтър купе</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" id="chkFuelFilter" class="accent-orange-500 rounded">
                            <span>Горивен филтър</span>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Километраж (км)</label>
                        <input type="number" id="recKm" required placeholder="185000" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Цена (€)</label>
                        <input type="number" step="0.01" id="recCost" required placeholder="120.00" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Бележки / Марка части</label>
                    <textarea id="recNotes" rows="2" placeholder="Total 5W30, филтър Mann..." class="w-full glass-input rounded-xl px-3 py-2 text-sm"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeRecordModal()" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-sm font-semibold hover:bg-slate-700">Отказ</button>
                    <button type="submit" class="flex-1 py-2 bg-orange-600 text-white rounded-xl text-sm font-semibold hover:bg-orange-500">Запази запис</button>
                </div>
            </form>
        </div>
    </div>

        let appData = JSON.parse(localStorage.getItem('autolog_data')) || {
            activeCarId: 'car_1',
            cars: [
                { id: 'car_1', name: 'Citroen C4 (I / II / Cactus...)', year: '2011', vin: '', engine: '1.4 HDi / 1.6 HDi', fuel: 'Дизел', km: 185000 }
            ],
            records: {}
        };

        function saveData() {
            localStorage.setItem('autolog_data', JSON.stringify(appData));
        }

        function getCurrentCar() {
            return appData.cars.find(c => c.id === appData.activeCarId) || appData.cars[0];
        }

        function updateFuelPriceDisplay() {
            const car = getCurrentCar();
            const fuelInfo = fuelPrices[car.fuel] || fuelPrices['Бензин'];
            document.getElementById('fuelLabel').innerText = `${fuelInfo.label}`;
            document.getElementById('carFuelPrice').innerText = `€ ${fuelInfo.price.toFixed(2)} / л`;
        }

        function renderCarSelect() {
            const select = document.getElementById('carSelect');
            select.innerHTML = appData.cars.map(c => 
                `<option value="${c.id}" ${c.id === appData.activeCarId ? 'selected' : ''}>🚗 ${c.name} (${c.engine || c.fuel})</option>`
            ).join('');
        }

        function switchCar(carId) {
            appData.activeCarId = carId;
            saveData();
            updateUI();
        }

        function updateUI() {
            renderCarSelect();
            const car = getCurrentCar();
            if (!car) return;

            document.getElementById('carFuelBadge').innerText = car.fuel;
            document.getElementById('carTitle').innerText = car.name;
            document.getElementById('carSubTitle').innerText = `${car.year || ''} ${car.engine ? '• ' + car.engine : ''}`;

            const vinDisplay = document.getElementById('carVinDisplay');
            if (car.vin && car.vin.trim() !== '') {
                document.getElementById('carVinText').innerText = car.vin;
                vinDisplay.classList.remove('hidden');
            } else {
                vinDisplay.classList.add('hidden');
            }

            updateFuelPriceDisplay();
            renderRecords();
        }

        function onBrandChange() {
            const brand = document.getElementById('carBrandSelect').value;
            const customContainer = document.getElementById('customBrandContainer');
            const modelSelect = document.getElementById('carModelSelect');
            const engineSelect = document.getElementById('carEngineSelect');
            const customEngineContainer = document.getElementById('customEngineContainer');
            const fuelInput = document.getElementById('carFuelInput');

            if (brand === 'Друга') {
                customContainer.classList.remove('hidden');
                modelSelect.innerHTML = '<option value="Друг модел">Друг модел</option>';
                engineSelect.innerHTML = '<option value="Друг двигател" data-fuel="Бензин">Друг двигател</option>';
                customEngineContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
                customEngineContainer.classList.add('hidden');
                
                const brandData = carDatabase[brand] || { models: ['Стандартен модел'], engines: universalEngines };
                
                const modelsList = brandData.models || ['Стандартен модел'];
                modelSelect.innerHTML = modelsList.map(m => `<option value="${m}">${m}</option>`).join('');

                const enginesList = brandData.engines || universalEngines;
                engineSelect.innerHTML = enginesList.map(e => `<option value="${e.name}" data-fuel="${e.fuel}">${e.name} (${e.fuel})</option>`).join('') + '<option value="Друг двигател (Ръчно)">Друг двигател (Ръчно)</option>';
                
                if (enginesList.length > 0) {
                    fuelInput.value = enginesList[0].fuel;
                }
            }
        }

        function onEngineChange() {
            const engineSelect = document.getElementById('carEngineSelect');
            const customEngineContainer = document.getElementById('customEngineContainer');
            const fuelInput = document.getElementById('carFuelInput');

            if (engineSelect.value === 'Друг двигател (Ръчно)') {
                customEngineContainer.classList.remove('hidden');
            } else {
                customEngineContainer.classList.add('hidden');
                const selectedOption = engineSelect.options[engineSelect.selectedIndex];
                if (selectedOption && selectedOption.dataset.fuel) {
                    fuelInput.value = selectedOption.dataset.fuel;
                }
            }
        }

        function toggleFilterOptions() {
            const cat = document.getElementById('recCategory').value;
            const box = document.getElementById('filterCheckboxes');
            if (cat === 'Масло & Филтри') {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            const carRecords = appData.records[appData.activeCarId] || [];
            const categoryFilter = document.getElementById('filterCategory').value;

            const filtered = carRecords.filter(r => categoryFilter === 'all' || r.category === categoryFilter);
            
            const total = carRecords.reduce((sum, r) => sum + Number(r.cost || 0), 0);
            document.getElementById('totalSpent').innerText = `€ ${total.toFixed(2)}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 glass rounded-xl text-slate-500 text-xs">
                        Няма намерени записи за този автомобил.
                    </div>`;
                return;
            }

            container.innerHTML = filtered.sort((a, b) => new Date(b.date) - new Date(a.date)).map((r) => {
                let filtersMarkup = '';
                if (r.filters && r.filters.length > 0) {
                    filtersMarkup = `
                        <div class="flex flex-wrap gap-1 mt-1.5">
                            ${r.filters.map(f => `<span class="bg-orange-950/70 text-orange-300 border border-orange-500/30 text-[10px] px-2 py-0.5 rounded-md">✓ ${f}</span>`).join('')}
                        </div>`;
                }

                return `
                <div class="glass rounded-xl p-3 shadow-md space-y-1">
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-orange-400 uppercase tracking-wider">${r.category}</span>
                            <h4 class="text-sm font-bold text-slate-100">${r.title}</h4>
                        </div>
                        <span class="text-sm font-bold text-emerald-400">€ ${Number(r.cost).toFixed(2)}</span>
                    </div>
                    ${filtersMarkup}
                    ${r.notes ? `<p class="text-xs text-slate-400 bg-slate-900/40 p-2 rounded-lg mt-1">${r.notes}</p>` : ''}
                    <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-800/50 mt-1">
                        <span><i class="fa-regular fa-calendar me-1"></i>${r.date}</span>
                        <span><i class="fa-solid fa-gauge me-1"></i>${Number(r.km).toLocaleString()} км</span>
                    </div>
                </div>`;
            }).join('');
        }

        function openCarModal(isEdit = false) {
            const modal = document.getElementById('carModal');
            const car = isEdit ? getCurrentCar() : null;

            document.getElementById('carModalTitle').innerText = isEdit ? 'Редактирай автомобил' : 'Добави автомобил';
            document.getElementById('carId').value = isEdit ? car.id : '';
            
            document.getElementById('carBrandSelect').value = 'Citroen';
            onBrandChange();

            if (isEdit) {
                document.getElementById('carYearInput').value = car.year || '';
                document.getElementById('carVinInput').value = car.vin || '';
                document.getElementById('carKmInput').value = car.km || '';
                document.getElementById('carFuelInput').value = car.fuel || 'Бензин';
            } else {
                document.getElementById('carYearInput').value = '';
                document.getElementById('carVinInput').value = '';
                document.getElementById('carKmInput').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeCarModal() {
            document.getElementById('carModal').classList.add('hidden');
        }

        function saveCar(e) {
            e.preventDefault();
            const id = document.getElementById('carId').value;
            const brand = document.getElementById('carBrandSelect').value;
            
            let carName = brand;
            if (brand === 'Друга') {
                carName = document.getElementById('carCustomName').value || 'Друг автомобил';
            } else {
                const modelText = document.getElementById('carModelSelect').value;
                carName = `${brand} ${modelText}`;
            }

            let engineText = document.getElementById('carEngineSelect').value;
            if (engineText === 'Друг двигател (Ръчно)') {
                engineText = document.getElementById('carCustomEngine').value || 'Собствен двигател';
            }

            const fuelType = document.getElementById('carFuelInput').value;

            const newCar = {
                id: id || `car_${Date.now()}`,
                name: carName,
                year: document.getElementById('carYearInput').value,
                vin: document.getElementById('carVinInput').value,
                engine: engineText,
                fuel: fuelType,
                km: Number(document.getElementById('carKmInput').value || 0)
            };

            if (id) {
                const idx = appData.cars.findIndex(c => c.id === id);
                appData.cars[idx] = newCar;
            } else {
                appData.cars.push(newCar);
                appData.activeCarId = newCar.id;
            }

            saveData();
            closeCarModal();
            updateUI();
        }

        function deleteCurrentCar() {
            if (appData.cars.length <= 1) {
                alert('Трябва да имате поне един автомобил!');
                return;
            }
            if (confirm('Сигурни ли сте, че искате да изтриете този автомобил и цялата му история?')) {
                const carId = appData.activeCarId;
                appData.cars = appData.cars.filter(c => c.id !== carId);
                delete appData.records[carId];
                appData.activeCarId = appData.cars[0].id;
                saveData();
                updateUI();
            }
        }

        function openRecordModal() {
            document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('recKm').value = getCurrentCar().km || '';
            toggleFilterOptions();
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const carId = appData.activeCarId;
            if (!appData.records[carId]) appData.records[carId] = [];

            const category = document.getElementById('recCategory').value;
            const selectedFilters = [];
            if (category === 'Масло & Филтри') {
                if (document.getElementById('chkOilFilter').checked) selectedFilters.push('Маслен филтър');
                if (document.getElementById('chkAirFilter').checked) selectedFilters.push('Въздушен филтър');
                if (document.getElementById('chkCabinFilter').checked) selectedFilters.push('Филтър купе');
                if (document.getElementById('chkFuelFilter').checked) selectedFilters.push('Горивен филтър');
            }

            const km = Number(document.getElementById('recKm').value);
            const record = {
                title: document.getElementById('recTitle').value,
                category: category,
                filters: selectedFilters,
                date: document.getElementById('recDate').value,
                km: km,
                cost: Number(document.getElementById('recCost').value),
                notes: document.getElementById('recNotes').value
            };

            appData.records[carId].push(record);

            const car = getCurrentCar();
            if (km > car.km) {
                car.km = km;
            }

            saveData();
            closeRecordModal();
            document.getElementById('recordForm').reset();
            updateUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            onBrandChange();
            updateUI();
        });
