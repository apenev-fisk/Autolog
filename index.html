<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLog - Сервизна книга</title>
    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/jpeg" href="watermarked_img_16635183195398438804.jpg">
    <link rel="apple-touch-icon" href="watermarked_img_16635183195398438804.jpg">
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"AutoLog - Service Tracker","short_name":"AutoLog","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"watermarked_img_16635183195398438804.jpg","sizes":"512x512","type":"image/jpeg"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
        .glass-input:focus { border-color: #ea580c; outline: none; }
    </style>
</head>
<body class="pb-12">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="watermarked_img_16635183195398438804.jpg" alt="Logo" class="w-8 h-8 rounded-lg object-cover border border-orange-500/30 shadow">
                <span class="font-bold text-lg tracking-tight text-white">Auto<span class="text-orange-500">Log</span></span>
            </div>
            <button onclick="openBackupModal()" class="text-xs font-semibold text-slate-300 bg-slate-800/80 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-shield-halved text-orange-400"></i> Архив
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Car Selection Bar -->
        <div class="flex items-center justify-between gap-2 glass p-2 rounded-xl">
            <div class="flex items-center gap-2 flex-1">
                <i class="fa-solid fa-garage text-slate-400 text-xs ms-1"></i>
                <select id="carSelect" onchange="switchCar(this.value)" class="glass-input text-xs font-semibold rounded-lg px-2 py-1.5 w-full">

                </select>
            </div>
            <button onclick="openCarModal()" class="px-3 py-1.5 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1 transition shadow">
                <i class="fa-solid fa-plus"></i> Кола
            </button>
        </div>

        <!-- Smart Reminder Banner -->
        <div id="reminderBanner" class="hidden glass border-l-4 border-amber-500 rounded-xl p-3 text-xs space-y-1">
            <div class="flex items-center justify-between font-bold text-amber-400">
                <span><i class="fa-solid fa-bell me-1.5"></i> Напомняне за автомобила</span>
                <button onclick="dismissReminder()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="reminderText" class="text-slate-300">--</p>
        </div>

        <!-- Vehicle Profile Card -->
        <section class="glass rounded-2xl p-4 shadow-xl relative overflow-hidden space-y-2">
            <div class="flex items-start justify-between">
                <div>
                    <span id="carFuelBadge" class="inline-block px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase bg-slate-800 text-orange-400 rounded-md mb-1 border border-slate-700">
                        --
                    </span>
                    <h2 id="carTitle" class="text-xl font-bold text-white tracking-tight">Зареждане...</h2>
                    <p id="carSubTitle" class="text-xs text-slate-400 mt-0.5">--</p>
                </div>
                <div class="flex gap-1">
                    <button onclick="openCarModal(true)" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                    </button>
                    <button onclick="deleteCurrentCar()" class="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Mileage Update Bar -->
            <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl border border-slate-800 text-xs">
                <span class="text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-gauge text-orange-400"></i> Пробег: <strong id="carKmDisplay" class="text-white">0</strong> км
                </span>
                <button onclick="promptUpdateKm()" class="text-[10px] font-semibold bg-orange-600/80 hover:bg-orange-500 text-white px-2 py-1 rounded-lg transition">
                    <i class="fa-solid fa-arrows-rotate"></i> Обнови км
                </button>
            </div>

            <!-- Plate & VIN Display -->
            <div class="flex flex-wrap gap-2 pt-1">
                <div id="carPlateDisplay" class="text-[11px] text-slate-300 font-mono bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 hidden">
                    <i class="fa-solid fa-car-side me-1 text-orange-400"></i> Рег. №: <span id="carPlateText" class="font-bold text-white">--</span>
                </div>
                <div id="carVinDisplay" class="text-[11px] text-slate-400 font-mono bg-slate-900/40 px-2.5 py-1 rounded-lg border border-slate-800/60 hidden">
                    <i class="fa-solid fa-fingerprint me-1 text-orange-400"></i> VIN: <span id="carVinText" class="text-slate-300">--</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80">
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/50">
                    <span id="fuelLabel" class="text-[11px] text-slate-400 block font-medium">Цена гориво (днес)</span>
                    <span id="carFuelPrice" class="text-base font-bold text-orange-400">€ 0.00 / л</span>
                </div>
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/50">
                    <span class="text-[11px] text-slate-400 block font-medium">Общо разходи</span>
                    <span id="totalSpent" class="text-base font-bold text-emerald-400">€ 0.00</span>
                </div>
            </div>
        </section>

        <!-- Quick Statistics Panel -->
        <section class="glass rounded-2xl p-3.5 space-y-2 border border-slate-800">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider">
                <span><i class="fa-solid fa-chart-pie me-1.5 text-orange-500"></i> Статистика за разходите</span>
                <span id="currentYearLabel" class="text-orange-400 font-mono">2026</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400 block text-[10px]">Тази година</span>
                    <span id="yearSpent" class="font-bold text-base text-orange-400">€ 0.00</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/60">
                    <span class="text-slate-400 block text-[10px]">Най-много за:</span>
                    <span id="topCategory" class="font-bold text-xs text-slate-200 truncate block mt-0.5">Няма данни</span>
                </div>
            </div>
        </section>

        <!-- Quick Add Record Action -->
        <button onclick="openRecordModal()" class="w-full py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-semibold rounded-xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 transition active:scale-[0.99]">
            <i class="fa-solid fa-plus-circle"></i> Добави обслужване / ремонт
        </button>

        <!-- Filter & Service History -->
        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">История</h3>
                <select id="filterCategory" onchange="renderRecords()" class="glass-input text-xs rounded-lg px-2 py-1 max-w-[170px]">
                    <option value="all">Всички категории</option>
                    <option value="Масло & Филтри">Масло & Филтри</option>
                    <option value="Газова уредба (LPG/CNG)">Газова уредба (LPG)</option>
                    <option value="Екология & Изпускателна сист.">Екология & Гърнета</option>
                    <option value="Ходова част & Окачване">Ходова част & Окачване</option>
                    <option value="Спирачна система">Спирачна система</option>
                    <option value="Климатик & Охлаждане">Климатик & Охлаждане</option>
                    <option value="Двигател & Запалителна система">Двигател & Свещи</option>
                    <option value="Трансмисия & Съединител">Трансмисия & Съединител</option>
                    <option value="Акумулатор & Електроника">Акумулатор & Електроника</option>
                    <option value="Гуми & Джанти">Гуми & Джанти</option>
                    <option value="Документи & Винетки">Документи & Винетки</option>
                    <option value="Други">Други</option>
                </select>
            </div>

            <div id="recordsList" class="space-y-2.5">
                <!-- Records injected here -->
            </div>
        </section>
    </main>

    <!-- Modal: Backup & Restore -->
    <div id="backupModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-orange-500"></i> Архив и сигурност
                </h3>
                <button onclick="closeBackupModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-2 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <label class="text-xs font-semibold text-orange-400 block">Изпрати сервизна история по имейл</label>
                <input type="email" id="backupEmailInput" placeholder="вашият-имейл@gmail.com" class="w-full glass-input rounded-xl px-3 py-2 text-sm">
                <button onclick="sendBackupEmail()" class="w-full py-2 bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-paper-plane"></i> Изпрати архив по Имейл
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="downloadBackupFile()" class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-download text-orange-400"></i> Свали файл (.json)
                </button>
                <label class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 transition cursor-pointer">
                    <i class="fa-solid fa-upload text-emerald-400"></i> Възстанови архив

                </label>
            </div>

            <button onclick="closeBackupModal()" class="w-full py-2 bg-slate-900 text-slate-400 rounded-xl text-xs font-semibold hover:bg-slate-800">Затвори</button>
        </div>
    </div>

        <div class="glass rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">

            <form id="carForm" onsubmit="saveCar(event)" class="space-y-3">

                        <option value="Audi">Audi</option>
                        <option value="BMW">BMW</option>
                        <option value="Citroen">Citroen</option>
                        <option value="Dacia">Dacia</option>
                        <option value="Fiat">Fiat</option>
                        <option value="Ford">Ford</option>
                        <option value="Honda">Honda</option>
                        <option value="Hyundai">Hyundai</option>
                        <option value="Jeep">Jeep</option>
                        <option value="Kia">Kia</option>
                        <option value="Lexus">Lexus</option>
                        <option value="Mazda">Mazda</option>
                        <option value="Mercedes-Benz">Mercedes-Benz</option>
                        <option value="Nissan">Nissan</option>
                        <option value="Opel">Opel</option>
                        <option value="Peugeot">Peugeot</option>
                        <option value="Renault">Renault</option>
                        <option value="Seat">Seat</option>
                        <option value="Skoda">Skoda</option>
                        <option value="Suzuki">Suzuki</option>
                        <option value="Toyota">Toyota</option>

                <div id="customBrandContainer" class="hidden">

                <div>

                            <option value="Екология & Изпускателна сист.">Екология & Гърнета</option>
                            <option value="Ходова част & Окачване">Ходова част & Окачване</option>

    <!-- Load Database Script First -->
    <script src="carData.js"></script>

    <!-- Main App Logic -->
    <script>
        let appData = JSON.parse(localStorage.getItem('autolog_data')) || {
            activeCarId: 'car_1',
            cars: [
                { id: 'car_1', name: 'Citroen C4', year: '2011', vin: '', plate: 'A 3574 HX', engine: '1.6 HDi', fuel: 'Дизел', km: 185000 }
            ],
            records: {}
        };

        function saveData() {
            localStorage.setItem('autolog_data', JSON.stringify(appData));
        }

        function getCurrentCar() {
            return appData.cars.find(c => c.id === appData.activeCarId) || appData.cars[0];
        }

        function updateFuelPriceDisplay() {
            const car = getCurrentCar();
            const fuelInfo = fuelPrices[car.fuel] || fuelPrices['Бензин'];
            document.getElementById('fuelLabel').innerText = `${fuelInfo.label}`;
            document.getElementById('carFuelPrice').innerText = `€ ${fuelInfo.price.toFixed(2)} / л`;
        }

        function renderCarSelect() {
            const select = document.getElementById('carSelect');
            select.innerHTML = appData.cars.map(c => 
                `<option value="${c.id}" ${c.id === appData.activeCarId ? 'selected' : ''}>🚗 ${c.name} ${c.plate ? '[' + c.plate + ']' : ''}</option>`
            ).join('');
        }

        function switchCar(carId) {
            appData.activeCarId = carId;
            saveData();
            updateUI();
        }

        function promptUpdateKm() {
            const car = getCurrentCar();
            const newKm = prompt(`Въведете нов актуален километраж за ${car.name}:`, car.km || 0);
            if (newKm !== null && !isNaN(newKm) && Number(newKm) >= 0) {
                car.km = Number(newKm);
                saveData();
                updateUI();
            }
        }

        function checkSmartReminders() {
            const car = getCurrentCar();
            const records = appData.records[car.id] || [];
            const banner = document.getElementById('reminderBanner');
            const text = document.getElementById('reminderText');

            // Find last oil change record
            const oilRecords = records.filter(r => r.category === 'Масло & Филтри').sort((a,b) => new Date(b.date) - new Date(a.date));
            if (oilRecords.length > 0) {
                const lastOil = oilRecords[0];
                const kmDiff = car.km - Number(lastOil.km || 0);
                if (kmDiff >= 9000) {
                    banner.classList.remove('hidden');
                    text.innerHTML = `Последната смяна на масло е била на <strong>${lastOil.km} км</strong> (преди ${kmDiff.toLocaleString()} км). Време е за обслужване!`;
                    return;
                }
            }

            banner.classList.add('hidden');
        }

        function dismissReminder() {
            document.getElementById('reminderBanner').classList.add('hidden');
        }

        function addToCalendar(title, dateStr, notes) {
            const startDate = dateStr.replace(/-/g, '');
            const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDate}/${startDate}&details=${encodeURIComponent(notes)}`;
            window.open(googleUrl, '_blank');
        }

        function updateUI() {
            renderCarSelect();
            const car = getCurrentCar();
            if (!car) return;

            document.getElementById('carFuelBadge').innerText = car.fuel;
            document.getElementById('carTitle').innerText = car.name;
            document.getElementById('carSubTitle').innerText = `${car.year || ''} ${car.engine ? '• ' + car.engine : ''}`;
            document.getElementById('carKmDisplay').innerText = Number(car.km || 0).toLocaleString();

            const plateDisplay = document.getElementById('carPlateDisplay');
            if (car.plate && car.plate.trim() !== '') {
                document.getElementById('carPlateText').innerText = car.plate;
                plateDisplay.classList.remove('hidden');
            } else {
                plateDisplay.classList.add('hidden');
            }

            const vinDisplay = document.getElementById('carVinDisplay');
            if (car.vin && car.vin.trim() !== '') {
                document.getElementById('carVinText').innerText = car.vin;
                vinDisplay.classList.remove('hidden');
            } else {
                vinDisplay.classList.add('hidden');
            }

            updateFuelPriceDisplay();
            updateStatistics();
            checkSmartReminders();
            renderRecords();
        }

        function updateStatistics() {
            const carRecords = appData.records[appData.activeCarId] || [];
            const currentYear = new Date().getFullYear();
            document.getElementById('currentYearLabel').innerText = currentYear;

            let yearTotal = 0;
            let categoryTotals = {};

            carRecords.forEach(r => {
                const cost = Number(r.cost || 0);
                if (r.date && r.date.startsWith(String(currentYear))) {
                    yearTotal += cost;
                }
                categoryTotals[r.category] = (categoryTotals[r.category] || 0) + cost;
            });

            document.getElementById('yearSpent').innerText = `€ ${yearTotal.toFixed(2)}`;

            let topCat = 'Няма данни';
            let maxCost = 0;
            for (let cat in categoryTotals) {
                if (categoryTotals[cat] > maxCost) {
                    maxCost = categoryTotals[cat];
                    topCat = cat;
                }
            }
            document.getElementById('topCategory').innerText = topCat;
        }

        function onBrandChange() {
            const brand = document.getElementById('carBrandSelect').value;
            const customContainer = document.getElementById('customBrandContainer');
            const modelSelect = document.getElementById('carModelSelect');
            const engineSelect = document.getElementById('carEngineSelect');
            const customEngineContainer = document.getElementById('customEngineContainer');
            const fuelInput = document.getElementById('carFuelInput');

            if (brand === 'Друга') {
                customContainer.classList.remove('hidden');
                modelSelect.innerHTML = '<option value="Друг модел">Друг модел</option>';
                engineSelect.innerHTML = '<option value="Друг двигател" data-fuel="Бензин">Друг двигател</option>';
                customEngineContainer.classList.remove('hidden');
            } else {
                customContainer.classList.add('hidden');
                customEngineContainer.classList.add('hidden');
                
                const brandData = carDatabase[brand] || { models: ['Стандартен модел'], engines: universalEngines };
                
                modelSelect.innerHTML = (brandData.models || ['Стандартен модел']).map(m => `<option value="${m}">${m}</option>`).join('');
                engineSelect.innerHTML = (brandData.engines || universalEngines).map(e => `<option value="${e.name}" data-fuel="${e.fuel}">${e.name} (${e.fuel})</option>`).join('') + '<option value="Друг двигател (Ръчно)">Друг двигател (Ръчно)</option>';
                
                if (brandData.engines && brandData.engines.length > 0) {
                    fuelInput.value = brandData.engines[0].fuel;
                }
            }
        }

        function onEngineChange() {
            const engineSelect = document.getElementById('carEngineSelect');
            const customEngineContainer = document.getElementById('customEngineContainer');
            const fuelInput = document.getElementById('carFuelInput');

            if (engineSelect.value === 'Друг двигател (Ръчно)') {
                customEngineContainer.classList.remove('hidden');
            } else {
                customEngineContainer.classList.add('hidden');
                const selectedOption = engineSelect.options[engineSelect.selectedIndex];
                if (selectedOption && selectedOption.dataset.fuel) {
                    fuelInput.value = selectedOption.dataset.fuel;
                }
            }
        }

        function toggleFilterOptions() {
            const cat = document.getElementById('recCategory').value;
            const container = document.getElementById('dynamicCheckboxesContainer');
            const items = categoryCheckboxes[cat] || [];

            if (items.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = `
                <label class="text-xs font-semibold text-orange-400 block mb-1">Детайли за ${cat}:</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    ${items.map((item, idx) => `
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="checkbox" id="chk_item_${idx}" value="${item}" class="accent-orange-500 rounded">
                            <span>${item}</span>
                        </label>
                    `).join('')}
                </div>
            `;
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            const carRecords = appData.records[appData.activeCarId] || [];
            const categoryFilter = document.getElementById('filterCategory').value;

            const filtered = carRecords.filter(r => categoryFilter === 'all' || r.category === categoryFilter);
            
            const total = carRecords.reduce((sum, r) => sum + Number(r.cost || 0), 0);
            document.getElementById('totalSpent').innerText = `€ ${total.toFixed(2)}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 glass rounded-xl text-slate-500 text-xs">
                        Няма намерени записи за този автомобил.
                    </div>`;
                return;
            }

            const sortedRecords = [...filtered].sort((a, b) => {
                if (b.date === a.date) {
                    return (b.timestamp || 0) - (a.timestamp || 0);
                }
                return new Date(b.date) - new Date(a.date);
            });

            container.innerHTML = sortedRecords.map((r) => {
                let filtersMarkup = '';
                if (r.filters && r.filters.length > 0) {
                    filtersMarkup = `
                        <div class="flex flex-wrap gap-1 mt-1.5">
                            ${r.filters.map(f => `<span class="bg-orange-950/70 text-orange-300 border border-orange-500/30 text-[10px] px-2 py-0.5 rounded-md">✓ ${f}</span>`).join('')}
                        </div>`;
                }

                let imageMarkup = '';
                if (r.image) {
                    imageMarkup = `
                        <div class="mt-2">
                            <a href="${r.image}" target="_blank" class="block">
                                <img src="${r.image}" alt="Фактура" class="w-20 h-20 object-cover rounded-lg border border-slate-700 hover:opacity-80 transition">
                            </a>
                        </div>`;
                }

                const calendarBtn = r.category === 'Документи & Винетки' ? `
                    <button onclick="addToCalendar('AutoLog: ${r.title}', '${r.date}', '${r.notes || ''}')" class="text-[10px] text-amber-400 hover:underline flex items-center gap-1 ms-2">
                        <i class="fa-regular fa-calendar-plus"></i> В Календара
                    </button>` : '';

                return `
                <div class="glass rounded-xl p-3 shadow-md space-y-1 relative group">
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-orange-400 uppercase tracking-wider">${r.category}</span>
                            <h4 class="text-sm font-bold text-slate-100 flex items-center">${r.title} ${calendarBtn}</h4>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-emerald-400">€ ${Number(r.cost).toFixed(2)}</span>
                            <button onclick="deleteRecord('${r.id}')" class="text-slate-500 hover:text-red-400 p-1 rounded transition" title="Изтрий записа">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                    ${filtersMarkup}
                    ${r.notes ? `<p class="text-xs text-slate-400 bg-slate-900/40 p-2 rounded-lg mt-1">${r.notes}</p>` : ''}
                    ${imageMarkup}
                    <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-800/50 mt-1">
                        <span><i class="fa-regular fa-calendar me-1"></i>${r.date}</span>
                        <span><i class="fa-solid fa-gauge me-1"></i>${Number(r.km).toLocaleString()} км</span>
                    </div>
                </div>`;
            }).join('');
        }

        function deleteRecord(recordId) {
            if (confirm('Сигурни ли сте, че искате да изтриете този запис от историята?')) {
                const carId = appData.activeCarId;
                if (appData.records[carId]) {
                    appData.records[carId] = appData.records[carId].filter(r => r.id !== recordId);
                    saveData();
                    updateUI();
                }
            }
        }

        function openBackupModal() {
            document.getElementById('backupModal').classList.remove('hidden');
        }

        function closeBackupModal() {
            document.getElementById('backupModal').classList.add('hidden');
        }

        function sendBackupEmail() {
            const email = document.getElementById('backupEmailInput').value.trim();
            if (!email) {
                alert('Моля, въведете валиден имейл адрес!');
                return;
            }

            const subject = encodeURIComponent("AutoLog - Архив на сервизна история");
            const jsonString = JSON.stringify(appData, null, 2);
            
            let bodyText = "Здравейте,\n\nЕто пълния архив на вашите автомобили и сервизна история от AutoLog:\n\n";
            appData.cars.forEach(car => {
                bodyText += `🚗 ${car.name} (Рег. №: ${car.plate || 'Няма'}, VIN: ${car.vin || 'Няма'})\n`;
                const carRecs = appData.records[car.id] || [];
                carRecs.forEach(r => {
                    bodyText += `  • ${r.date} - ${r.title} (${r.category}) - ${r.km} км - €${r.cost}\n`;
                });
                bodyText += "\n";
            });

            bodyText += "\n--- КОД ЗА ВЪЗСТАНОВЯВАНЕ ---\n" + jsonString;

            window.location.href = `mailto:${email}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
        }

        function downloadBackupFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `autolog_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function restoreFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed && parsed.cars) {
                        appData = parsed;
                        saveData();
                        updateUI();
                        alert('Архивът беше възстановен успешно!');
                        closeBackupModal();
                    } else {
                        alert('Грешка: Невалиден файл с архив!');
                    }
                } catch (err) {
                    alert('Грешка при прочитане на файла!');
                }
            };
            reader.readAsText(file);
        }

        function openCarModal(isEdit = false) {
            const modal = document.getElementById('carModal');
            const car = isEdit ? getCurrentCar() : null;

            document.getElementById('carModalTitle').innerText = isEdit ? 'Редактирай автомобил' : 'Добави автомобил';
            document.getElementById('carId').value = isEdit ? car.id : '';
            
            document.getElementById('carBrandSelect').value = 'Citroen';
            onBrandChange();

            if (isEdit) {
                document.getElementById('carPlateInput').value = car.plate || '';
                document.getElementById('carYearInput').value = car.year || '';
                document.getElementById('carVinInput').value = car.vin || '';
                document.getElementById('carKmInput').value = car.km || '';
                document.getElementById('carFuelInput').value = car.fuel || 'Бензин';
            } else {
                document.getElementById('carPlateInput').value = '';
                document.getElementById('carYearInput').value = '';
                document.getElementById('carVinInput').value = '';
                document.getElementById('carKmInput').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeCarModal() {
            document.getElementById('carModal').classList.add('hidden');
        }

        function saveCar(e) {
            e.preventDefault();
            const id = document.getElementById('carId').value;
            const brand = document.getElementById('carBrandSelect').value;
            
            let carName = brand;
            if (brand === 'Друга') {
                carName = document.getElementById('carCustomName').value || 'Друг автомобил';
            } else {
                carName = `${brand} ${document.getElementById('carModelSelect').value}`;
            }

            let engineText = document.getElementById('carEngineSelect').value;
            if (engineText === 'Друг двигател (Ръчно)') {
                engineText = document.getElementById('carCustomEngine').value || 'Собствен двигател';
            }

            const newCar = {
                id: id || `car_${Date.now()}`,
                name: carName,
                plate: document.getElementById('carPlateInput').value.trim().toUpperCase(),
                year: document.getElementById('carYearInput').value,
                vin: document.getElementById('carVinInput').value.trim().toUpperCase(),
                engine: engineText,
                fuel: document.getElementById('carFuelInput').value,
                km: Number(document.getElementById('carKmInput').value || 0)
            };

            if (id) {
                const idx = appData.cars.findIndex(c => c.id === id);
                appData.cars[idx] = newCar;
            } else {
                appData.cars.push(newCar);
                appData.activeCarId = newCar.id;
            }

            saveData();
            closeCarModal();
            updateUI();
        }

        function deleteCurrentCar() {
            if (appData.cars.length <= 1) {
                alert('Трябва да имате поне един автомобил!');
                return;
            }
            if (confirm('Сигурни ли сте, че искате да изтриете този автомобил и цялата му история?')) {
                const carId = appData.activeCarId;
                appData.cars = appData.cars.filter(c => c.id !== carId);
                delete appData.records[carId];
                appData.activeCarId = appData.cars[0].id;
                saveData();
                updateUI();
            }
        }

        function openRecordModal() {
            document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('recKm').value = getCurrentCar().km || '';
            document.getElementById('recCategory').value = 'Масло & Филтри';
            document.getElementById('recImageInput').value = '';
            toggleFilterOptions();
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const carId = appData.activeCarId;
            if (!appData.records[carId]) appData.records[carId] = [];

            const category = document.getElementById('recCategory').value;
            const selectedFilters = [];
            
            const container = document.getElementById('dynamicCheckboxesContainer');
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(chk => {
                if (chk.checked) selectedFilters.push(chk.value);
            });

            const km = Number(document.getElementById('recKm').value);
            const imageInput = document.getElementById('recImageInput');

            function finishRecord(imageData = null) {
                const record = {
                    id: `rec_${Date.now()}`,
                    timestamp: Date.now(),
                    title: document.getElementById('recTitle').value,
                    category: category,
                    filters: selectedFilters,
                    date: document.getElementById('recDate').value,
                    km: km,
                    cost: Number(document.getElementById('recCost').value),
                    notes: document.getElementById('recNotes').value,
                    image: imageData
                };

                appData.records[carId].push(record);

                const car = getCurrentCar();
                if (km > car.km) {
                    car.km = km;
                }

                saveData();
                closeRecordModal();
                document.getElementById('recordForm').reset();
                updateUI();
            }

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    finishRecord(evt.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                finishRecord(null);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            onBrandChange();
            updateUI();
        });
    </script>
</body>
</html>
